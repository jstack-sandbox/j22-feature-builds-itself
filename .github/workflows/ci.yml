name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  lint-app:
    name: 01 lint app
    runs-on: ubuntu-24.04
    environment: ci-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: lint the app layer's lang-a sources
        run: |
          [ -d src/reminders ] || exit 0
          awk '/\/\/ unused$/ { print FILENAME ":" FNR ": unused variable " $2; bad = 1 } END { exit bad }' src/reminders/*.a
  tests-app:
    name: 02 tests app
    runs-on: ubuntu-24.04
    environment: ci-release
    steps:
      - run: echo "the app layer's tests pass"
