name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  lint-app:
    name: 01 lint app
    runs-on: ubuntu-24.04
    environment: ci-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: lint the app layer's lang-a sources
        run: |
          [ -d src/reminders ] || exit 0
          awk '/\/\/ unused$/ { print FILENAME ":" FNR ": unused variable " $2; bad = 1 } END { exit bad }' src/reminders/*.a
  tests-app:
    name: 02 tests app
    runs-on: ubuntu-24.04
    environment: ci-release
    steps:
      - name: run the app layer's runner-a tests
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p reports
          curl -fsSL -o bundle.json \
            "https://raw.githubusercontent.com/$REPO/jstack-fixtures/$SHA/reports.json" ||
            echo '{}' > bundle.json
          jq -r 'keys[]' bundle.json | while read -r file; do
            mkdir -p "reports/$(dirname "$file")"
            jq -r --arg f "$file" '.[$f]' bundle.json > "reports/$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore
