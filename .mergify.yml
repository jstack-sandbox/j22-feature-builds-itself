queue_rules:
  - name: default
    batch_size: 1
    merge_method: merge
    checks_timeout: 30 minutes
    queue_conditions:
      - "base=main"
      - "approved-reviews-by=jstack-sandbox-owner"
      - "check-success=01 lint app"
      - "check-success=02 tests app"
      - "check-success=setup/queue"
    merge_conditions:
      - "check-success=01 lint app"
      - "check-success=02 tests app"
      - "check-success=setup/merge"
pull_request_rules:
  - name: queue what the owner approved
    conditions:
      - "approved-reviews-by=jstack-sandbox-owner"
    actions:
      queue: {}
  - name: an approval stands on the head it approved
    conditions: []
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
